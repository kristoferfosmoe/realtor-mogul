name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mogul
          POSTGRES_PASSWORD: mogul
          POSTGRES_DB: mogul
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mogul" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Migrations apply and roll back on Postgres
        env:
          MOGUL_DATABASE_URL: postgresql+psycopg://mogul:mogul@localhost:5432/mogul
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run python -m mogul.ingest demo
          uv run alembic downgrade base

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types match the backend schema
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/openapi.json src/lib/api-schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
