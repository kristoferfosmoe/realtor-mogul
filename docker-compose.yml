services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mogul
      POSTGRES_PASSWORD: mogul
      POSTGRES_DB: mogul
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mogul"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    environment:
      MOGUL_DATABASE_URL: postgresql+psycopg://mogul:mogul@db:5432/mogul
      MOGUL_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]

  # Refreshes market data once a day. Sources publish monthly/weekly, so daily is plenty.
  ingest:
    build: ./backend
    environment:
      MOGUL_DATABASE_URL: postgresql+psycopg://mogul:mogul@db:5432/mogul
      MOGUL_RAW_DATA_DIR: /data/raw
      # Optional: set these in your shell or .env to sweep for-sale listings daily.
      MOGUL_RENTCAST_API_KEY: ${MOGUL_RENTCAST_API_KEY:-}
      MOGUL_LISTING_AREAS: ${MOGUL_LISTING_AREAS:-[]}
    volumes: [rawdata:/data/raw]
    depends_on: [api] # api applies migrations on start
    command:
      - sh
      - -c
      - >-
        sleep 20; while true; do
        python -m mogul.ingest run all;
        if [ -n "$$MOGUL_RENTCAST_API_KEY" ]; then python -m mogul.ingest listings rentcast; fi;
        sleep 86400; done

  web:
    build:
      context: ./web
      args:
        MOGUL_API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  rawdata:
